# Phase (a), the smoke run: the primary arm's outer loop with a full checkpoint
# at each round instead of a delta at every step.
#
# The smoke run checks that rounds close and agree and measures the step. It
# checkpoints the classical way, so its tokens/s is the outer loop's without
# the saves Moonclip would choose between two checkpoints (a full of GPT-2
# small with AdamW's moments is about 1.5 GB); what those saves cost is
# measured by the row the plan keeps for it in (b).
backend: moonclip
delta: false
checkpoint_every: 100
keep_last: 2
outer_save_dtype: null
outer_overlap: false
outer_combine: mean
outer_deadline: 1200
metrics_every: 10
