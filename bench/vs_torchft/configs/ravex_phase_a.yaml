# Phase (a), the smoke run: the primary arm's outer loop with a full checkpoint
# at each round instead of a delta at every step.
#
# The smoke run checks that rounds close and agree, measures the step, and
# runs on the cheapest machines that fit; a delta per step of deepseek-1b is
# about a full's 11 GB (with Adam the moments barely delta), which those
# machines' disks would not hold for a window. So (a) checkpoints the classical
# way, and its tokens/s is the outer loop's without Ravex's per-step save; the
# delta's cost is measured by the row the plan keeps for it in (b).
backend: moonclip
delta: false
checkpoint_every: 100
keep_last: 2
outer_save_dtype: null
outer_overlap: false
outer_combine: mean
outer_deadline: 1200
metrics_every: 10
