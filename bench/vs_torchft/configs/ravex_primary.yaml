# The Ravex arm of the primary comparison (plan, section 3).
#
# H, the outer learning rate and the outer momentum are not here: train_ravex.py
# passes them from its command line, the same flags train_torchft.py takes, so
# the two arms cannot drift apart by editing one file. What is here is what only
# Ravex has a setting for, at the value the comparison needs.
backend: moonclip
# A delta at every step, Ravex's default. Its cost is inside the arm's tokens/s;
# the plan's extra row with `delta: false` separates it.
#
# Mind the disk: Moonclip keeps a window of `checkpoint_every` steps of saves,
# at most `keep_last` fulls' worth of bytes (GPU-517). For GPT-2 small a full
# with AdamW's moments is about 1.5 GB, so the window stays within a few of
# them; measure it in phase (a) before sizing the machines' disks for (b).
delta: true
checkpoint_every: 10
# fp32 on the wire, as torchft allreduces in the parameters' dtype.
outer_save_dtype: null
# Blocking rounds and a fixed H: torchft's DiLoCo with one fragment does the same.
outer_overlap: false
outer_combine: mean
# Long enough for an fp32 round of GPT-2 small across the ocean (0.5 GB at
# 7-12 MB/s is 40-70 s) with a wide margin; a round that runs out of it closes
# over whoever answered, which is the behaviour being measured. A node that
# died is left out at once (GPU-213), so this bounds only a slow one.
outer_deadline: 1200
metrics_every: 10
